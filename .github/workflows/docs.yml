name: Docs

# Checks that the documentation site still builds. Deployment is handled by
# Cloudflare Workers Builds, not by this workflow.

on:
  push:
    branches: [main]
    paths:
      - 'apps/docs/**'
      - 'packages/**'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'apps/docs/**'
      - 'packages/**'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/docs.yml'

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      # The docs import the workspace packages, so build them first.
      - run: bun run build:packages
      - run: bun run --cwd apps/docs build
